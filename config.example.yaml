# Example hooshang configuration. Copy to config.yaml and adjust.
# Environment overrides:
#   HOOSHANG_TELEGRAM_TOKEN  -> telegram.token
#   HOOSHANG_LLM_API_KEY     -> llm.api_key

telegram:
  token: "123456:FAKE-TELEGRAM-TOKEN"
  owner_id: 123456789        # your Telegram user ID (find it with @userinfobot)

llm:
  base_url: "http://localhost:1234/v1"   # LM Studio; later: https://openrouter.ai/api/v1
  api_key: "lm-studio"
  model: "gemma-4-31b-it-mlx"            # required
  memory_model: ""                       # empty = same as model
  temperature: 0.9                       # memory calls always use 0.2
  max_tokens: 4096                       # min 1024 (the model reasons before answering)
  timeout: 180s                          # tool rounds plus reasoning can take a minute
  tools: true                            # enable LLM tool calling at all (faal/poem, stickers, glossary, admin memory edits)
  json_schema: true                      # response_format json_schema for memory extraction (31B: 5/5, 2x faster; breaks the 26B)
  embedding_model: "text-embedding-bge-m3"  # the embedding model loaded next to the chat model (features.rag); "" = no retrieval
  context_tokens: 32768                  # the context window the chat model is loaded with; prompts are trimmed to fit

bot:
  name: "هوشنگ"
  aliases: ["هوشی", "hooshang"]
  language: "fa"
  history_messages: 15                   # max messages of the transcript sent to the LLM
  history_window: 20m                    # ...and only those this recent, so old topics drop out
  profile_budget: 3000                   # characters of member profiles per prompt: the people the message
                                         # is about and the author first, then members in the history, then
  random_profiles: 2                     # this many random other members, while the budget allows
  message_retention: 72h                 # how long plain messages are kept
  spontaneous_chance: 0.07               # chance of speaking when not addressed, [0,1]
  reaction_chance: 0.15                  # chance of reacting with an emoji when not addressed
  reaction_cooldown: 1m                  # min time between such reactions
  spontaneous_cooldown: 5m               # min time between spontaneous messages
  min_msgs_between: 8                    # min new messages before a spontaneous attempt
  modes:                                 # weights for spontaneous topics; merges with the
                                         # defaults (set a mode to 0 to disable it)
    joke: 3
    tease: 3
    flirt: 1
    compliment: 2
    comment: 2
    sticker: 1                           # answer the moment with a sticker or GIF, no words
  rate_limit:
    global_per_minute: 10
    chat_per_minute: 6
  # Who the bot is. The system prompt is short and general; the behaviour is
  # yours to write here. `text` replaces the built-in identity paragraph, `notes`
  # are appended as extra lines (English or Persian). Delete or edit freely.
  persona:
    text: ""
    notes:
      - "Teasing is between friends: cheeky, with a bite, never about appearance, weight, health, disability or family."
      - "When someone insults or mocks you, hit back harder; Persian swearing is fine against them, and stop when they stop."
      - "Serious questions (about the group, a member, a term, a fact) get a plain, helpful answer with no jab."
      - "Asked to roast someone: real bite, aimed only at that person; leave the one who asked alone."
      - "Mushy or dramatic messages (🥺🥰💕, «قربونت برم») may get mock-sweet or دوپهلو answers now and then, never the same way twice."
      - "Flirting stays light and wholesome: compliments and wordplay, never sexual or possessive."
      - "If someone is really hurt by a joke, drop it with a casual «باشه بابا»."
  # Human timing: the bot waits as if typing, sometimes answers late, sleeps at
  # night, has a mood of the day and may answer in a few short bubbles.
  human:
    typing:
      enabled: true
      chars_per_second: 25
      min: 1s
      max: 6s
    late_chance: 0.05                    # now and then it answers late, as if away from the phone
    late_max: 45s
    quiet_hours: "01:30-08:00"           # Tehran; no spontaneous messages, reactions or greetings (replies still come)
    moods: []                            # empty = normal most days, else sleepy/hyper/grumpy/soft/nostalgic; any text works
    bubbles: 3                           # most chat bubbles per reply (1 = never split)

# Features: the optional parts of the bot. A feature is on when its section is
# present and off when it is not: comment a section out to turn the feature off.
# `enabled: false` inside a section also turns it off and keeps its settings.
# Keys left out of a present section take the defaults shown here; an empty
# section (just `roast:`) is on with all defaults.
features:

  # Profiles: what the bot remembers about each member as items (facts, interests,
  # quirks, relationships, boundaries, dated episodes, stances, running jokes, looks
  # from their profile photos), each with how often it was seen; what it remembers
  # about itself (stances, jokes, promises); and how the group writes. The admin
  # edits memory in plain language. Off: no memory updates, no profiles in prompts,
  # /me and /forgetme say the feature is off, no get_memory / edit_memory tools.
  profiles:
    update_every: 15                     # update a member's memory every N of their messages
    max_age: 24h                         # older memories are re-checked
    context_messages: 150                # messages the memory updater sees
    max_items: 10                        # max items per kind
    self_every: 20                       # update the bot's own memory every N of its messages (0 = off)
    style_samples: 12                    # anonymised sample messages of the group shown in the system prompt (0 = off)
    seed:                                # read a member's Telegram profile when first seen, and again after `refresh`
      photos: 2                          # profile photos described by the vision model into "look" items (0 = off)
      bio: true                          # the bio and birthday, when Telegram exposes them
      refresh: 720h

  # Group memory: the topics and events the group cared about most (by reactions
  # and replies). Reactions are only delivered while the bot is a group admin.
  group_memory:
    ttl: 168h                            # forget an event a week after it was last seen
    max_items: 15                        # kept per group, highest engagement first
    update_every: 50                     # group messages between updates
    in_prompt: 4                         # events shown to the model
    prompt_chance: 0.3                   # how often they're shown in a reply / spontaneous message

  # Glossary: the group's own words and phrases (اصطلاحات). Anyone can teach one
  # («هوشنگ، "چاییدن" یعنی سرما خوردن»). When it is full, the term used least
  # recently is forgotten. Only the terms that come up in the conversation are shown.
  # Also gates /terms and the learn_term / forget_term tools.
  glossary:
    max_items: 100                       # terms kept per group (LRU)
    in_prompt: 8                         # terms shown to the model at most

  # Media: photos, stickers and GIFs are described by the model (it must be a
  # vision model, e.g. Gemma 4) and the description is added to the transcript:
  # «[استیکر: 😂 — گربه‌ای که از خنده غش کرده]». Sticker and GIF descriptions are
  # cached by Telegram's file id and reused in every group.
  media:
    photos: true
    stickers: true
    gifs: true                           # from the GIF's thumbnail (its first frame) or, with ffmpeg, from several frames
    send: true                           # the find_media / send_media tools: answer with a sticker or GIF the group has used
    words: 30                            # description length in words
    cache_ttl: 2160h                     # reuse sticker/GIF descriptions for 90 days
    max_queue: 20                        # pending descriptions; more are skipped
    frames: 3                            # frames sent for a video sticker or GIF (1-8; 1 = thumbnail only);
                                         # needs ffmpeg (brew install ffmpeg), else the thumbnail is used
    ffmpeg: ""                           # path to ffmpeg (also used by voice); empty = look it up in PATH

  # Faal: /faal, the hafez_faal tool and asking for «فال» in words.
  faal:
    image: true                          # send the ghazal as a Nastaliq image (معنی in the caption)

  # Poem: /poem and the random_poem tool.
  poem:
    image: true                          # send the 2 بیت as the same Nastaliq card

  # Roast: /roast. (The spontaneous "tease" mode is set under bot.modes.)
  roast:

  # Voice: voice messages and video notes are transcribed locally with
  # whisper.cpp (brew install whisper-cpp) and the text goes into the transcript:
  # «[ویس: متن پیاده‌شده]». A voice that says the bot's name, or replies to it,
  # is answered once it has been transcribed.
  voice:
    whisper: ""                          # path to whisper-cli; empty = look it up in PATH
    model: "models/ggml-large-v3-turbo-q5_0.bin"  # required; a multilingual ggml model (never a .en one)
    language: "fa"
    threads: 0                           # 0 = whisper's default
    max_duration: 120s                   # longer voices stay «[ویس]»
    max_queue: 10                        # pending transcriptions; more are skipped
    max_words: 120                       # transcript length cap
    video_notes: true                    # round video messages too (ffmpeg takes the audio)

  # Retrieval (RAG): member messages are archived for months and embedded with
  # llm.embedding_model; a reply gets the older messages relevant to it, a big
  # memory shows only its relevant items, find_media and the glossary also match by
  # meaning. Needs llm.embedding_model; without it this section does nothing.
  rag:
    archive_ttl: 4320h                   # keep archived messages for 180 days
    top_k: 5                             # older messages shown in a reply at most
    min_score: 0.55                      # least cosine similarity to count as relevant (bge-m3: related ≈ 0.8, unrelated ≈ 0.45)
    decay_days: 30                       # half-life of the recency bonus
    batch: 16                            # texts per embedding call
    max_queue: 500                       # pending embeddings
    max_per_chat: 50000                  # message vectors kept in memory per chat

  # Greetings: now and then answers a member's «صبح بخیر» / «شب بخیر», welcomes
  # new members and comments when someone leaves.
  greetings:
    chance: 0.6                          # chance of answering a greeting
    member_cooldown: 12h                 # don't greet the same member again within
    chat_cooldown: 30m                   # don't greet anyone in the chat again within
    welcome: true
    farewell: true
  # Moderation: the admin tells the bot in plain words («این پیامو حذف کن», «علی رو یه ساعت ساکت کن»,
  # «بن کن») and it acts at once. The bot needs the matching admin rights (delete messages, ban users,
  # pin messages). Admins can narrow the allowed actions at runtime («فقط حذف کن، بن نکن»).
  moderation:
    actions: [delete, mute, kick, ban, unban, pin, unpin]   # what the bot may do (default all)
    default_mute: 1h                     # mute length when none is given
    max_mute: 168h                       # longest mute
    max_delete: 20                       # most messages deleted in one request

# Rendering of the faal and poem cards (features.faal.image, features.poem.image).
nastaliq:
  font: ""                               # a Nastaliq .ttf; empty = embedded Gulzar (HarfBuzz) or Noto Nastaliq Urdu (go-text)
  shaper: auto                           # auto: HarfBuzz's hb-shape if installed (brew install harfbuzz),
                                         # else go-text, which draws Nastaliq flat with some dots misplaced

storage:
  path: "./data"                         # Badger data directory
